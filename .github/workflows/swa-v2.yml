name: Deploy v2 to Azure Static Web Apps

on:
  push:
    branches: [redesign/v2]
  workflow_dispatch:

jobs:
  build_and_deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Run tests
        working-directory: app
        run: npm test

      - name: Build frontend (static export)
        working-directory: app
        run: npm run build

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Publish API (.NET 9 isolated)
        run: dotnet publish api -c Release -o api/bin/publish

      # Both app and api are prebuilt; the action only uploads. The API runtime
      # comes from platform.apiRuntime in staticwebapp.config.json.
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_V2 }}
          action: upload
          app_location: app/out
          skip_app_build: true
          api_location: api/bin/publish
          skip_api_build: true
          output_location: ""
