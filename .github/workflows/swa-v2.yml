name: Deploy v2 to Azure Static Web Apps

on:
  push:
    branches: [redesign/v2]
  workflow_dispatch:

jobs:
  build_and_deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Run tests
        working-directory: app
        run: npm test

      - name: Build frontend (static export)
        working-directory: app
        run: npm run build

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      # SWA caps managed-function content at 104857600 bytes. A RID-agnostic
      # publish ships SkiaSharp's native binaries for every runtime it knows
      # (~20 RIDs, 477 MB) and the content server rejects the upload outright —
      # which is what happened on 2026-07-28, leaving the site stuck on the
      # 07-27 build. SWA runs these functions on Windows, so pin the RID; the
      # native debug symbols are another 85 MB (libSkiaSharp.pdb) and buy
      # nothing in a deployed function. Result: 40 MB published, 15 MB zipped.
      # `--self-contained false` keeps worker.config.json's `dotnet
      # Ebrostay.Api.dll` launch valid — do not drop it.
      - name: Publish API (.NET 9 isolated)
        run: |
          dotnet publish api -c Release -r win-x64 --self-contained false -o api/bin/publish
          find api/bin/publish -name '*.pdb' -delete

      # Both app and api are prebuilt; the action only uploads. The API runtime
      # comes from platform.apiRuntime in staticwebapp.config.json.
      #
      # `skip_app_build` is the only skip this action has. There is no
      # `skip_api_build` — passing one only earns an "Unexpected input(s)"
      # annotation on every run, which is what it did until 2026-07-31. The API
      # is not rebuilt because `api/bin/publish` is compiled output with no
      # project file in it, so Oryx finds nothing to build. If this ever points
      # at source again, that changes — and the RID-pinned publish above, the
      # only thing keeping the upload under the size cap, would be bypassed.
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_V2 }}
          action: upload
          app_location: app/out
          skip_app_build: true
          api_location: api/bin/publish
          output_location: ""
