     staticwebapp.config.json) is not in effect, e.g. plain `next dev`. -->

    <meta charset="utf-8" />
    <title>Ebrostay</title>
    <meta http-equiv="refresh" content="0; url=/es/" />

    <script>window.location.replace("/es/" + window.location.search);</script>
  </head>
  <body>
    <p><a href="/es/">Ebrostay — continuar en español</a> · <a href="/en/">continue in English</a></p>
  </body>
</html>
