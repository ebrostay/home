/* ================================================================
   VIEWER — pan/zoom pane, no build step.
   ================================================================ */
const S = 0.25;                 // 1 canvas px = 4 page px
const AB_W = 1280 * S;          // artboard sheet width
const SAT_W = 132, SAT_GAP = 24;
const SLOT = AB_W + SAT_GAP + SAT_W + 130;  // artboard + satellites + air
const HEAD_H = 92;

const world = document.getElementById('world');
const canvas = document.getElementById('canvas');
const tip = document.getElementById('tip');

const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');

// legend
document.getElementById('legend').innerHTML = Object.entries(TYPES).map(([k, name]) =>
  `<span class="chip"><i style="background:var(--c-${k}-bg);border-color:var(--c-${k}-line)"></i>${name}</span>`).join('');

let maxH = 0;
PAGES.forEach((p, i) => {
  const abX = 40 + i * SLOT;
  const H = p.pageHeight * S;
  maxH = Math.max(maxH, H + HEAD_H);
  const ab = document.createElement('div');
  ab.className = 'artboard';
  ab.style.left = abX + 'px';
  ab.style.top = '30px';

  const rails = p.columns.filter(c => c.sticky);
  ab.innerHTML = `
    <div class="abhead">
      <div class="name">${esc(p.brand)}</div>
      <div class="meta mono">${esc(p.url)} · ${p.pageHeight.toLocaleString('en')} px tall</div>
      <div class="thesis">${esc(p.note)}</div>
    </div>
    <div class="sheet" style="height:${H}px">
      ${rails.map(c => `<div class="lane sticky" data-label="${esc(c.label || 'sticky')}"
          style="left:${c.x * S - 2}px;top:${(Math.min(...p.blocks.filter(b => b.col === c.id).map(b => b.y)) || 0) * S - 4}px;
                 width:${c.w * S + 4}px;height:${(Math.max(...p.blocks.filter(b => b.col === c.id).map(b => b.y + b.h)) - Math.min(...p.blocks.filter(b => b.col === c.id).map(b => b.y))) * S + 8}px"></div>`).join('')}
      ${p.blocks.map(b => {
        const col = p.columns.find(c => c.id === b.col);
        return `<div class="blk" data-ab="${p.id}" data-id="${b.id}"
          style="left:${col.x * S}px;top:${b.y * S}px;width:${col.w * S}px;height:${Math.max(b.h * S, 10)}px;
                 background:var(--c-${b.type}-bg);border-color:var(--c-${b.type}-line)"
          data-label="${esc(b.label)}" data-note="${esc(b.note || '')}" data-geom="y ${b.y} · ${b.h} px · ${esc(TYPES[b.type])}">
          <b>${esc(b.label)}</b>${b.note ? `<span>${esc(b.note)}</span>` : ''}
          ${b.exit ? `<span class="exit">↗ ${esc(b.exit)}</span>` : ''}</div>`;
      }).join('')}
    </div>
    ${p.overlays.length ? `<div class="satlabel" style="left:${AB_W + SAT_GAP}px;top:-4px">overlays</div>` : ''}
    ${p.overlays.map((o, j) => `<div class="sat" data-ab="${p.id}" data-id="${o.id}"
        style="left:${AB_W + SAT_GAP}px;top:${14 + j * 74}px;border-color:var(--c-${o.type}-line)">
        <b>${esc(o.label)}</b>${o.note ? `<span>${esc(o.note)}</span>` : ''}</div>`).join('')}
    <svg class="wires" width="${SLOT}" height="${H}" style="left:0;top:0"></svg>`;

  world.appendChild(ab);

  // wires — drawn from data geometry (deterministic, no layout reads)
  const svg = ab.querySelector('svg.wires');
  // sheet sits below abhead; wires SVG shares the sheet's coordinate space
  svg.style.top = ab.querySelector('.sheet').offsetTop + 'px';
  const mid = b => {
    const col = p.columns.find(c => c.id === b.col);
    return { l: col.x * S, r: (col.x + col.w) * S, y: (b.y + b.h / 2) * S, t: b.y * S };
  };
  let wires = '', labels = '';
  p.arrows.forEach(a => {
    const from = p.blocks.find(b => b.id === a.from);
    const toBlk = p.blocks.find(b => b.id === a.to);
    const toOvl = p.overlays.findIndex(o => o.id === a.to);
    const f = mid(from);
    if (toBlk) { // in-page jump: route along the left margin
      const t = mid(toBlk);
      const bow = Math.min(34, 12 + Math.abs(t.y - f.y) * 0.02);
      wires += `<path class="wire-jump" d="M ${f.l} ${f.y} C ${f.l - bow} ${f.y}, ${t.l - bow} ${t.t + 8}, ${t.l - 4} ${t.t + 8}"/>
        <polygon class="wirehead-jump" points="${t.l - 4},${t.t + 4.5} ${t.l + 1},${t.t + 8} ${t.l - 4},${t.t + 11.5}"/>`;
      if (a.label) labels += `<text class="wirelabel" x="${f.l - bow - 2}" y="${(f.y + t.t) / 2}" text-anchor="end">${esc(a.label)}</text>`;
    } else if (toOvl > -1) { // opens overlay: route right to the satellite
      const sx = AB_W + SAT_GAP - 4;
      const sy = 14 + toOvl * 74 + 26 - parseFloat(svg.style.top);
      wires += `<path class="wire-open" d="M ${f.r} ${f.y} C ${f.r + 40} ${f.y}, ${sx - 40} ${sy}, ${sx} ${sy}"/>
        <polygon class="wirehead-open" points="${sx},${sy - 3.5} ${sx + 5},${sy} ${sx},${sy + 3.5}"/>`;
      if (a.label) labels += `<text class="wirelabel" x="${f.r + 6}" y="${f.y - 4}">${esc(a.label)}</text>`;
    }
  });
  svg.innerHTML = wires + labels;
});

/* ---------- pan / zoom ---------- */
let vx = 0, vy = 0, vz = 1;
const apply = () => { world.style.transform = `translate(${vx}px,${vy}px) scale(${vz})`; };
const fit = () => {
  const wW = 40 + PAGES.length * SLOT, wH = maxH + 60;
  vz = Math.min((innerWidth - 40) / wW, (innerHeight - 120) / wH, 1.6);
  vx = (innerWidth - wW * vz) / 2; vy = 70;
  apply();
};
fit(); addEventListener('resize', fit);

let drag = null;
canvas.addEventListener('pointerdown', e => {
  drag = { x: e.clientX - vx, y: e.clientY - vy };
  canvas.classList.add('dragging'); canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e => {
  if (drag) { vx = e.clientX - drag.x; vy = e.clientY - drag.y; apply(); }
});
canvas.addEventListener('pointerup', () => { drag = null; canvas.classList.remove('dragging'); });
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const k = Math.exp(-e.deltaY * 0.0015);
  const nz = Math.min(4, Math.max(0.08, vz * k));
  vx = e.clientX - (e.clientX - vx) * (nz / vz);
  vy = e.clientY - (e.clientY - vy) * (nz / vz);
  vz = nz; apply();
}, { passive: false });
const zoomBy = k => { const nz = Math.min(4, Math.max(0.08, vz * k));
  vx = innerWidth / 2 - (innerWidth / 2 - vx) * (nz / vz);
  vy = innerHeight / 2 - (innerHeight / 2 - vy) * (nz / vz); vz = nz; apply(); };
document.getElementById('zi').onclick = () => zoomBy(1.25);
document.getElementById('zo').onclick = () => zoomBy(0.8);
document.getElementById('fit').onclick = fit;

/* ---------- theme toggle: auto → light → dark ---------- */
const root = document.documentElement;
document.getElementById('theme').onclick = () => {
  const cur = root.getAttribute('data-theme');
  root.setAttribute('data-theme', cur === 'light' ? 'dark' : cur === 'dark' ? '' : 'light');
  if (!root.getAttribute('data-theme')) root.removeAttribute('data-theme');
};

/* ---------- tooltip ---------- */
addEventListener('pointermove', e => {
  const blk = e.target.closest?.('.blk');
  if (!blk) { tip.style.display = 'none'; return; }
  tip.innerHTML = `<b>${blk.dataset.label}</b>${blk.dataset.note ? blk.dataset.note : ''}<div class="t2">${blk.dataset.geom}</div>`;
  tip.style.display = 'block';
  tip.style.left = Math.min(e.clientX + 14, innerWidth - 300) + 'px';
  tip.style.top = (e.clientY + 14) + 'px';
});
</script>
