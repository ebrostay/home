name: Deploy v2 to Azure Static Web Apps

on:
  push:
    branches: [redesign/v2]
  workflow_dispatch:

jobs:
  build_and_deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Build frontend (static export)
        working-directory: app
        run: |
          npm ci
          npm run build

      # No test suite on this branch yet; the Playwright/API-test gate lands
      # with the v2 test task and must then become a required `needs:` job.
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_V2 }}
          action: upload
          app_location: app/out
          skip_app_build: true
          api_location: api
          output_location: ""
